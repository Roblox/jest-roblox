[package]
name = "roblox/jest-circus"
description = "A Luau testing framework based on Jest. See roblox/jest-globals for the entry point."
version = "3.21.0"
license = "MIT"
authors = ["Roblox <no-reply@roblox.com>"]
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
repository = "https://github.com/Roblox/jest-roblox"

exclude = [
	"rotriever.toml",
	"**/__tests__/**",
	"**/__snapshots__/**",
	"**/__mocks__/**",
]

[dependencies]
LuauPolyfill = "roblox/luau-polyfill@^1.2.5"
Promise = "roblox/promise@^3.5.1"
RegExp = "roblox/regexp@^0.3.0"
ChalkLua = "roblox/chalk-lua@^0.3.0"
Symbol = "roblox/symbol@^1.0.0"
JestTypes = "roblox/jest-types@^3.21.0"
JestMatcherUtils = "roblox/jest-matcher-utils@^3.21.0"
JestMessageUtil = "roblox/jest-message-util@^3.21.0"
PrettyFormat = "roblox/pretty-format@^3.21.0"
JestEach = "roblox/jest-each@^3.21.0"
JestUtil = "roblox/jest-util@^3.21.0"
JestTestResult = "roblox/jest-test-result@^3.21.0"
JestEnvironment = "roblox/jest-environment@^3.21.0"
JestSnapshot = "roblox/jest-snapshot@^3.21.0"
Expect = "roblox/expect@^3.21.0"
RobloxShared = "roblox/roblox-shared@^3.21.0"
JestRuntime = "roblox/jest-runtime@^3.21.0"
Throat = "roblox/throat@^3.21.0"

[dev-dependencies]
JestGlobals = "roblox/jest-globals@^3.21.0"
JestSnapshotSerializerRaw = "roblox/jest-snapshot-serializer-raw@^3.21.0"
