name: CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  CODECOV_URL: https://ccov-ext.rbx.com

jobs:
  jest:
    name: Jest Roblox Tests
    timeout-minutes: 5
    runs-on: [self-hosted, generic-linux]
    permissions:
      contents: read
      id-token: write
    container:
      image: docker.artifactory.rbx.com/rbx-lua-build-tools:v2.0.0
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Generate access token
        uses: Roblox-ActionsCache/tibdex-github-app-token@v1.4.0
        id: setup_token
        with:
          app_id: ${{ secrets.TOKENS_APP_LUA_ECOSYSTEM_DEPENDENCIES_ID }}
          private_key: ${{ secrets.TOKENS_APP_LUA_ECOSYSTEM_DEPENDENCIES_KEY }}

      - name: Get foreman and run foreman install
        uses: Roblox/setup-foreman@v3
        with:
          version: "^1.0.0"
          token: ${{ steps.setup_token.outputs.token }}
          allow-external-github-orgs: true

      - name: Install rotriever packages
        shell: bash
        run: |
          rotrieve install --auth https://DummyUser:${{ steps.setup_token.outputs.token }}@github.com

      - name: Get robloxdev-cli via rbx-aged-cli
        shell: bash
        run: rbx-aged-cli download robloxdev-cli --logLevel=verbose
        env:
          AGED_BASE_URL: ${{ secrets.ARTIFACTORY_URL }}
          AGED_REPO: ${{ secrets.ARTIFACTORY_REPO }}
          AGED_USERNAME: ${{ secrets.ARTI_EDGE_LUAAPPS_USER }}
          AGED_PASSWORD: ${{ secrets.ARTI_EDGE_LUAAPPS_APIKEY }}
          AGED_CHANNEL: develop
          ROBLOX_CLIENT_TELEMETRY_DISABLED: true

      - name: Check versions
        shell: bash
        run: |
          ./robloxdev-cli version
          foreman list
          cat rotriever.lock

      - name: Run static analysis
        shell: bash
        run: |
          lute run analyze

      - name: Run tests
        shell: bash
        run: |
          lute run test default --ci --githubActions

      - name: Run tests (deferred lua)
        shell: bash
        run: |
          lute run test deferredlua --ci

      - name: Run tests (ocale)
        shell: bash
        env:
          ROBLOX_API_KEY: ${{ secrets.ROBLOX_API_KEY }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
        run: |
          lute run test ocale

      - name: Report code coverage
        uses: codecov/codecov-action@v4
        with:
          use_oidc: true
          files: lcov.info
          url: ${{ env.CODECOV_URL }}
          verbose: true
          fail_ci_if_error: false
          disable_safe_directory: true
